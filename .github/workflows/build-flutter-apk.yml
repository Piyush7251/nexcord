name: Build Nexcord Android APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/build-flutter-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Build Release APK
        working-directory: flutter_app
        run: flutter build apk --release

      - name: Copy APK as Nexcord-Flutter.apk
        run: cp flutter_app/build/app/outputs/flutter-apk/app-release.apk Nexcord-Flutter.apk

      - name: Upload Nexcord-Flutter.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nexcord-Flutter-APK-v1.1.0
          path: Nexcord-Flutter.apk
          if-no-files-found: error

      - name: Publish GitHub Release v1.1.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.1.0 >/dev/null 2>&1; then
            gh release upload v1.1.0 Nexcord-Flutter.apk --clobber
          else
            gh release create v1.1.0 Nexcord-Flutter.apk \
              --title "Nexcord v1.1.0 - Personal Calls & Material 3 UI" \
              --notes "Latest release APK with personal friend/contact calling and Material 3 UI." \
              --latest
          fi
