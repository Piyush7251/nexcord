name: Build Nexcord Android APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/build-flutter-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: 'stable'
          cache: true

      - name: Read App Version
        run: |
          VER=$(grep -E '^version:' flutter_app/pubspec.yaml | head -n1 | sed -E 's/version:[[:space:]]*([^+]+).*/\1/')
          echo "APP_VERSION=v${VER}" >> "$GITHUB_ENV"

      - name: Install Flutter Dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Build Release APK
        working-directory: flutter_app
        run: flutter build apk --release

      - name: Copy APK as Nexcord-Flutter.apk
        run: cp flutter_app/build/app/outputs/flutter-apk/app-release.apk Nexcord-Flutter.apk

      - name: Upload Nexcord-Flutter.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nexcord-Flutter-APK-${{ env.APP_VERSION }}
          path: Nexcord-Flutter.apk
          if-no-files-found: error

      - name: Publish GitHub Release ${{ env.APP_VERSION }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ env.APP_VERSION }}" >/dev/null 2>&1; then
            gh release upload "${{ env.APP_VERSION }}" Nexcord-Flutter.apk --clobber
          else
            gh release create "${{ env.APP_VERSION }}" Nexcord-Flutter.apk \
              --title "Nexcord ${{ env.APP_VERSION }} - Android 10 to 16 & Personal Calls" \
              --notes "Supports Android 10 through Android 16 plus 1-to-1 personal friend & phone-contact calling." \
              --latest
          fi
