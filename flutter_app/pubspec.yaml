name: nexcord_flutter
description: Nexcord — Discord-style Flutter Android & iOS app powered by Nexconn Chat SDK & Chat UI SDK.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2
  flutter: '>=3.29.2'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  ai_nexconn_chat_plugin: ^26.2.11
  ai_nexconn_chatui_plugin: ^26.2.11
  provider: ^6.1.2
  http: ^1.2.2
  shared_preferences: ^2.5.3
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/

